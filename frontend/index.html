<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuMind AI - Chat with PDFs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        }
        .chat-bubble-user {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .chat-bubble-ai {
            background: white;
            border: 1px solid #e5e7eb;
        }
        #chatBox::-webkit-scrollbar { width: 6px; }
        #chatBox::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 10px; }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-4xl h-[90vh] flex flex-col glass rounded-3xl shadow-2xl overflow-hidden">

        <!-- Header -->
        <header class="px-6 py-4 flex items-center justify-between border-b border-white/30">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-lg shadow-lg">
                    DM
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-800">DocuMind AI</h1>
                    <p class="text-xs text-gray-500">Chat with your documents</p>
                </div>
            </div>
            <div id="statusBadge" class="px-3 py-1 rounded-full text-xs font-medium bg-gray-200 text-gray-600">
                No PDF loaded
            </div>
        </header>

        <!-- Main Content -->
        <div class="flex-1 flex overflow-hidden">

            <!-- Sidebar - Upload -->
            <div class="w-72 border-r border-white/30 p-5 flex flex-col gap-4 bg-white/40">
                <div>
                    <h2 class="text-sm font-semibold text-gray-700 mb-3">Upload Documents</h2>
                    <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-indigo-300 rounded-2xl cursor-pointer hover:bg-indigo-50 transition">
                        <div class="text-center">
                            <svg class="w-8 h-8 mx-auto text-indigo-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                            </svg>
                            <p class="text-xs text-gray-600">Click or drag PDF</p>
                        </div>
                        <input type="file" id="pdfFile" accept=".pdf" class="hidden" multiple>
                    </label>
                    <button onclick="uploadPDF()" class="mt-3 w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white py-2.5 rounded-xl font-medium text-sm hover:opacity-90 transition shadow-md">
                        Process PDFs
                    </button>
                    <p id="uploadStatus" class="mt-2 text-xs text-center"></p>
                </div>

                <div class="flex-1 overflow-y-auto">
                    <h3 class="text-xs font-semibold text-gray-500 mb-2">Loaded Files</h3>
                    <div id="fileList" class="space-y-2 text-sm text-gray-700">
                        <p class="text-gray-400 text-xs">No files yet</p>
                    </div>
                </div>
            </div>

            <!-- Chat Area -->
            <div class="flex-1 flex flex-col">
                <div id="chatBox" class="flex-1 overflow-y-auto p-6 space-y-4">
                    <div class="text-center text-gray-500 text-sm mt-20">
                        <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-indigo-400 to-purple-500 flex items-center justify-center text-white text-2xl shadow-lg">
                            ✨
                        </div>
                        Upload PDFs and start asking questions
                    </div>
                </div>

                <!-- Input -->
                <div class="p-4 border-t border-white/30 bg-white/50">
                    <div class="flex gap-3">
                        <input type="text" id="question" 
                               placeholder="Ask anything about your documents..." 
                               class="flex-1 bg-white border border-gray-200 rounded-2xl px-5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 shadow-sm"
                               onkeypress="if(event.key==='Enter') askQuestion()">
                        <button onclick="askQuestion()" 
                                class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white px-6 py-3 rounded-2xl font-medium text-sm hover:opacity-90 transition shadow-md">
                            Send
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function uploadPDF() {
            const fileInput = document.getElementById('pdfFile');
            const status = document.getElementById('uploadStatus');
            const fileList = document.getElementById('fileList');
            
            if (!fileInput.files.length) {
                status.innerHTML = '<span class="text-red-500">Please select at least one PDF</span>';
                return;
            }

            status.innerHTML = '<span class="text-indigo-600">Processing... Please wait (first time may take 30-50 sec)</span>';

            const formData = new FormData();
            for (let file of fileInput.files) {
                formData.append("files", file);
            }

            try {
                const res = await fetch("https://pdf-chatbot-1-1ftx.onrender.com/upload", {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();
                
                status.innerHTML = `<span class="text-green-600">${data.message}</span>`;
                
                document.getElementById('statusBadge').innerHTML = `● Ready (${data.files.length} files)`;
                document.getElementById('statusBadge').className = "px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-700";

                fileList.innerHTML = data.files.map(f => `
                    <div class="bg-white rounded-xl px-3 py-2 shadow-sm flex items-center gap-2">
                        <span class="text-red-500">📄</span>
                        <span class="truncate text-xs">${f}</span>
                    </div>
                `).join('');

                document.getElementById('chatBox').innerHTML = `
                    <div class="text-center text-gray-500 text-sm">
                        <p class="font-medium text-gray-700">Documents ready!</p>
                        <p class="text-xs mt-1">Ask questions about your PDFs</p>
                    </div>`;
            } catch (err) {
                status.innerHTML = `<span class="text-red-500">Error: ${err.message}</span>`;
            }
        }

        async function askQuestion() {
            const questionInput = document.getElementById('question');
            const question = questionInput.value.trim();
            if (!question) return;

            const chatBox = document.getElementById('chatBox');
            
            if (chatBox.querySelector('.text-center')) {
                chatBox.innerHTML = '';
            }

            chatBox.innerHTML += `
                <div class="flex justify-end">
                    <div class="chat-bubble-user text-white rounded-2xl rounded-br-md px-4 py-2.5 max-w-[75%] text-sm shadow-md">
                        ${question}
                    </div>
                </div>
            `;
            questionInput.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div class="flex justify-start" id="${loadingId}">
                    <div class="chat-bubble-ai rounded-2xl rounded-bl-md px-4 py-2.5 text-sm text-gray-500 shadow-sm">
                        Thinking...
                    </div>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;

            const formData = new FormData();
            formData.append("question", question);

            try {
                const res = await fetch("https://pdf-chatbot-1-1ftx.onrender.com/ask", {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();

                document.getElementById(loadingId).remove();
                
                chatBox.innerHTML += `
                    <div class="flex justify-start">
                        <div class="chat-bubble-ai rounded-2xl rounded-bl-md px-4 py-2.5 max-w-[75%] text-sm text-gray-800 shadow-sm leading-relaxed">
                            ${data.answer}
                        </div>
                    </div>
                `;
            } catch (err) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-red-50 border border-red-200 text-red-600 rounded-2xl px-4 py-2.5 text-sm">
                            Error: ${err.message}
                        </div>
                    </div>
                `;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
